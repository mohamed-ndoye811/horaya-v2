services:
  postgres:
    image: postgres:16-alpine
    container_name: horaya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: horaya
      POSTGRES_PASSWORD: horaya
      POSTGRES_DB: horaya
    ports:
      - "5432:5432"
    volumes:
      - horaya_pg16:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horaya -d horaya"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Boîte mail de développement : tous les e-mails envoyés en local arrivent sur http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: horaya-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  # Nouveau volume : l'ancien (postgres_data, identifiants user/pass) reste intact sur ta machine.
  horaya_pg16:
