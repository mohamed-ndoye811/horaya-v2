name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Appelé par « Build and deploy » avant de construire les images.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: horaya
          POSTGRES_PASSWORD: horaya
          POSTGRES_DB: horaya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U horaya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Les tests d'intégration créent et migrent leurs bases `horaya_test_<package>`.
      DATABASE_URL: postgres://horaya:horaya@localhost:5432/horaya
      # Valeurs factices : nécessaires pour valider l'environnement au build.
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
